[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hrrp-osr"
version = "0.1.0"
description = "Reproducible experiments for multi-view HRRP open-set recognition"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0",
  "scipy>=1.11",
  "torch>=2.5,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
hrrp-p0 = "hrrp_osr.cli:main"
hrrp-amdr-smoke = "hrrp_osr.amdr.smoke:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
