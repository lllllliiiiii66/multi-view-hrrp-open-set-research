model:
  class_count: 5
  input_length: 601
  feature_map_shape: [128, 76]
  encoder_source: prior_r2_stem_stage1_stage2_stage3
  encoder_initial_state_shared_across_o1_o4: true
  pcssr:
    independent_class_autoencoders: 5
    encoder: {type: Conv1d, in_channels: 128, out_channels: 64, kernel_size: 1, bias: false}
    activation: Tanh
    decoder: {type: Conv1d, in_channels: 64, out_channels: 128, kernel_size: 1, bias: false}
    gamma: 0.1
    reconstruction_error: channel_sum_L1
    clip: [-100.0, 100.0]
    probability: class_softmax_per_position_then_position_mean
    classification_loss: negative_log_true_class_mean_probability
  matched_linear:
    type: Conv1d
    in_channels: 128
    out_channels: 5
    kernel_size: 1
    bias: false
    gamma: 0.1
    probability: class_softmax_per_position_then_position_mean
    classification_loss: negative_log_true_class_mean_probability

training:
