  epsilon: 1.0e-8

r2_model:
  architecture: ms_mean_head_factorial_v1
  encoder: hrrp_ms_resnet_1d_v1
  input_length: 601
  feature_map_shape: [128, 76]
  pooled_feature_dim: 128
  fusion: arithmetic_mean
  head: linear_ce
  prediction: own_fused_logits_argmax
  dropout: 0.1

methods:
  ordered:
    - Q0_FROZEN_R2_CC_MLS
    - Q1_CE_FINETUNE_CONTROL
    - Q2_E2E_REL_CSSR_1X1
    - Q3_E2E_ABSREL_CSSR_1X1
    - Q4_E2E_ABSREL_CSSR_LOCAL3
  trainable:
    - Q1_CE_FINETUNE_CONTROL
    - Q2_E2E_REL_CSSR_1X1
    - Q3_E2E_ABSREL_CSSR_1X1
    - Q4_E2E_ABSREL_CSSR_LOCAL3
  cssr_candidates:
    - Q2_E2E_REL_CSSR_1X1
    - Q3_E2E_ABSREL_CSSR_1X1
    - Q4_E2E_ABSREL_CSSR_LOCAL3
  q0_retraining: false

trainable_scope:
  frozen_modules: [encoder.stem, encoder.stages.0, encoder.stages.1]
  frozen_modules_forced_eval: true
  trainable_modules: [encoder.stages.2, encoder.projection, global_head]
  cssr_autoencoders_trainable_for_q2_q4: true
  frozen_parameters_and_buffers_hash_required: true
  strict_r2_load_required: true
  epoch0_common_state_exact_match_required: true
  reset_rng_after_model_and_optimizer_construction: true

autoencoders:
  class_count: 5
  input_channels: 128
  latent_channels: 64
  independent_per_class: true
  bias: false
  activation: Tanh
  q2_q3_kernel_size: 1
  q2_q3_padding: 0
  q2_q3_same_initialization_required: true
  q4_kernel_size: 3
  q4_padding: 1
  skip_connection: false
  normalization_layer: none
  attention: false
  extra_hidden_layers: 0

loss:
  relative:
    gamma: 0.1
    clip_min: -100.0
    clip_max: 100.0
    reconstruction_error: channel_sum_L1
    probability_order: class_softmax_per_position_then_position_mean
    view_reduction: arithmetic_mean
  absolute_reconstruction:
    numerator: per_sample_view_mean_absolute_reconstruction_error_over_channels_and_positions
    denominator: per_sample_view_mean_absolute_activation_over_channels_and_positions_plus_epsilon
    epsilon: 1.0e-8
  separation:
    nearest_wrong_class: minimum_normalized_absolute_reconstruction_error
    margin: 0.2
  batch_reduction: arithmetic_mean
  weights:
    Q1_CE_FINETUNE_CONTROL: {classification: 1.0, relative: 0.0, absolute: 0.0, separation: 0.0}
    Q2_E2E_REL_CSSR_1X1: {classification: 1.0, relative: 0.5, absolute: 0.0, separation: 0.0}
    Q3_E2E_ABSREL_CSSR_1X1: {classification: 1.0, relative: 0.5, absolute: 0.25, separation: 0.5}
    Q4_E2E_ABSREL_CSSR_LOCAL3: {classification: 1.0, relative: 0.5, absolute: 0.25, separation: 0.5}
  gradient_audit:
    ratio_scope: weighted_auxiliary_to_classification_on_last_residual_stage
    denominator_floor: 1.0e-12
    maximum_ratio: 100.0
    consecutive_epoch_mean_violations_to_fail: 3
    ae_gradients_record_only: true
    fail_on_nonfinite: true

training:
  optimizer: AdamW
  epochs: 20
  batch_size_pairs: 64
  warmup_epochs: 2
  scheduler: linear_warmup_then_cosine_to_zero
  scheduler_step_timing: before_each_epoch_optimizer_updates
  scheduler_factor_formula: "epoch<=2:epoch/2;epoch>2:0.5*(1+cos(pi*(epoch-3)/18));post_epoch_20:0"
  all_formal_epochs_have_nonzero_learning_rate: true
  zero_reached_after_formal_epoch: true
  gradient_clip_norm: 5.0
  finetune_seed: 20260904
  lr_last_stage: 3.0e-5
  lr_projection_and_ce_head: 1.0e-4
  lr_autoencoders: 1.0e-3
  weight_decay_last_stage: 5.0e-4
  weight_decay_projection_and_head: 5.0e-4
  weight_decay_autoencoders: 1.0e-4
  early_stopping: false
  formal_checkpoint_epoch: 20
  performance_checkpoint_selection: false
  diagnostic_epochs: [0, 5, 10, 15, 20]

diagnostics:
  known_calibration_only: true
  every_epoch: true
  metric_names:
    - accuracy
    - macro_f1
    - nll
    - brier
    - ece
    - mean_max_logit
    - mean_top1_top2_logit_margin
    - mean_single_view_feature_norm
    - mean_fused_feature_norm
    - ce_head_weight_norm
    - mean_fused_feature_l2_drift_from_epoch0
    - mean_kl_epoch0_to_current
  brier: per_sample_sum_over_class_then_sample_mean
  ece_bins: 15
  ece_bin_type: equal_width
  feature_drift: mean_pairwise_fused_feature_l2_from_epoch0
  kl_direction: epoch0_to_current
  diagnostic_only: true

calibration:
  cssr_reference_population: unique_known_calibration_base_samples_by_true_class
  cssr_reference_shared_across_view_slots: true
  cssr_reference_tail: greater_than_or_equal_r
  cssr_p_value_smoothing: plus_one_numerator_and_denominator
  cssr_score_transform: negative_log_p_plus_epsilon
  cssr_leave_one_base_sample_out: true
  mls_reference: correctly_predicted_known_calibration_pairs_by_true_class
  mls_nonconformity: negative_maximum_fused_logit
  mls_anomaly_quantile_tail: less_than_or_equal_nonconformity
  mls_leave_one_pair_out: true
  empty_class_reference_policy: fail
  score_epsilon: 1.0e-8
  threshold_source: own_known_calibration_only
  threshold_known_acceptance_rate: 0.95
  threshold_rule: exact_sorted_rank_ceiling

scores:
  direction: larger_is_more_unknown
  known_prediction: own_fused_ce_argmax
  main_by_method:
    Q0_FROZEN_R2_CC_MLS: class_conditional_mls
    Q1_CE_FINETUNE_CONTROL: class_conditional_mls
    Q2_E2E_REL_CSSR_1X1: fusion_guided_reconstruction
    Q3_E2E_ABSREL_CSSR_1X1: fusion_guided_reconstruction
    Q4_E2E_ABSREL_CSSR_LOCAL3: fusion_guided_reconstruction
  diagnostic_only_by_method:
    Q2_E2E_REL_CSSR_1X1: [class_conditional_mls]
    Q3_E2E_ABSREL_CSSR_1X1: [class_conditional_mls]
    Q4_E2E_ABSREL_CSSR_LOCAL3: [class_conditional_mls]
  prohibited:
    - independent_view_cssr
    - common_class_cssr
    - max_view
    - score_weighting
    - mls_cssr_linear_combination
    - learned_score_fusion
    - top2_class_mixture
    - learned_rejector

evaluation:
  report_metrics:
    - known_accuracy
    - known_macro_f1
    - auroc
    - oscr
    - fpr95
    - known_correct_acceptance_rate
    - unknown_rejection_rate
    - open_set_harmonic_score
    - k_plus_1_macro_f1
  per_pair_identity_context: true
  absorption_by_known_class: true
  ddg_bidirectional_absorption: true
  marvel_cape_reverse_diagnostic: true

pilot_gate:
