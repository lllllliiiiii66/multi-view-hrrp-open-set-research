sampling:
  fold_count: 5
  frame_width_deg: 15
  development_angle_parity: odd
  base_seed: 20260830
  slot_order: randomized_seeded
  distinct_frames: true
  pairs_per_class:
    smoke: 50
    full: 500
  final_test_pairs_generated: false

normalization:
  method: global_scalar_zscore
  fit_population: unique_train_known_base_samples_only
  epsilon: 1.0e-8

model:
  input_shape: [2, 601]
  encoder: shared_hrrp_encoder_1d_v1
  feature_dim: 128
  pooling: mean
  view_specific_encoder: false
  position_encoding: false
  permutation_invariant: true
  methods: [CE_MLS, CE_VIEW_AUX, ARPL_LITE, ARPL_VIEW_AUX]
  lambda_view: 0.5
  arpl:
    num_centers_per_class: 1
    reciprocal_init_std: 0.1
    initial_radius: 0.0
    temperature: 1.0
    weight_pl: 0.1
    margin: 1.0
    margin_scope: fused_only

training:
  development_seeds: [20260830]
  confirmation_seeds: [20260830, 20260831, 20260832]
  dataloader_seed_offset: 1
  max_epochs:
    smoke: 3
    full: 100
  batch_size: 64
  optimizer: AdamW
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  scheduler: none
  early_stopping_patience: 15
  selection_primary: known_calibration_accuracy
  selection_secondary: known_calibration_macro_f1
  data_augmentation: none
  deterministic_algorithms: true
  num_workers: 0
  numerical_fallback:
    trigger: nan_inf_or_optimizer_numerical_error_only
    learning_rate: 3.0e-4
    rerun_all_four_methods: true

evidence:
  ecdf_fit: known_calibration_only
  per_view_ecdf_pooling: symmetric_both_views_combined
  unknown_score_direction: larger_is_more_unknown
  rules:
    F0_FUSED: q_f
    F1_WORST_VIEW: max_q1_q2
    F2_EVIDENCE_UNION: max_qf_q1_q2
    F3_DISAGREEMENT_AWARE: max_qf_q1_q2_qjs
  diagnostic_rule: mean_q1_q2
  threshold_known_acceptance_rate: 0.95

development_selection:
  eligible_methods: [CE_VIEW_AUX, ARPL_VIEW_AUX]
  candidate_rules: [F1_WORST_VIEW, F2_EVIDENCE_UNION, F3_DISAGREEMENT_AWARE]
  unit_count: 6
  minimum_positive_auroc_units: 4
  minimum_mean_auroc_delta: 0.02
  minimum_mean_oscr_delta: 0.0
  tie_breakers: [mean_auroc_delta, mean_oscr_delta, fewer_components]
  stop_if_none_eligible: true

confirmation_decision:
  unit_count_per_head: 12
  minimum_mean_auroc_delta: 0.02
  minimum_positive_auroc_units: 8
  minimum_mean_oscr_delta: 0.0
  maximum_mean_known_accuracy_drop: 0.005
  maximum_mean_fpr95_increase: 0.02
  labels: [common_success, arpl_specific_success, ce_specific_success, no_stable_gain]

outputs:
  namespace: artifacts/arpl/arpl_mv_evidence_surrogate_v1
  fail_if_output_nonempty: true
  save_checkpoints: true
  save_features_logits_scores: true
  save_predictions: true
  save_ecdf_parameters: true
  save_training_logs: true
  save_pair_manifests: true
  save_artifact_hashes: true
