schema_version: 1
stage: P3_surrogate_mv_rpformer
experiment_id: mv_rpformer_surrogate_v1
result_scope: development_then_mandatory_confirmation_known_source_only

evidence_scope:
  source_known_odd_angle_only: true
  final_unknown_classes_used: false
  even_angle_test_used: false
  surrogate_unknown_used_for_training: false
  surrogate_unknown_used_for_checkpoint_selection: false
  angle_or_view_metadata_used_by_model: false

official_reference:
  repository: https://github.com/gary23ai/ARPL
  commit: 3ede8b38e1cfb9d70e106cc19d563453110c36ab
  dist_sha256: a05fc01c9051d8cb8d87cc7183e0a3d9fd1a11ca9de38d58a4870cb70ad4dc62
  arploss_sha256: 6dec41f0265b6665e8c66a27f506f176a0a7b0b2e4426760c09c203ab0c327ec

bundle:
  dataset_id: hrrp_10class_theta83_hh_v1
  preprocessing_id: hrrp_padding_complex_gaussian_v1
  profiles_sha256: 2dd92282c125f0f677cf1f2dfce828781c8ba4385cf9ae552c4a2c56033c3f5b
  manifest_sha256: 748b9f30629c3b3cbe66c6a1dac30863fdab2d81a214e46d8bc3ef7c6022a08a
  bundle_sha256: 79176091b5b745e5df5957f1bb4ade7304c1403a4a32e64622e012db67d5a0c5

classes:
  source_known_order:
    - CVN77
    - DDG-1000
    - DDG-112
    - 油气轮MARVEL CRANE
    - 爱达魔都号
    - 迷你好望角型散货船
    - 集装箱船达飞罗尔多夫级
  final_unknown_count: 3
  development_splits:
    - split_id: S0
      angle_fold: 1
      train_known_indices: [2, 3, 4, 5, 6]
      surrogate_unknown_indices: [0, 1]
    - split_id: S1
      angle_fold: 2
      train_known_indices: [0, 1, 4, 5, 6]
      surrogate_unknown_indices: [2, 3]
    - split_id: S2
      angle_fold: 3
      train_known_indices: [0, 1, 2, 3, 6]
      surrogate_unknown_indices: [4, 5]
  confirmation_splits:
    - split_id: C0
      angle_fold: 0
      train_known_indices: [1, 2, 3, 4, 5]
      surrogate_unknown_indices: [0, 6]
    - split_id: C1
      angle_fold: 4
      train_known_indices: [0, 2, 3, 4, 6]
      surrogate_unknown_indices: [1, 5]
    - split_id: C2
      angle_fold: 0
      train_known_indices: [0, 1, 3, 5, 6]
      surrogate_unknown_indices: [2, 4]
    - split_id: C3
      angle_fold: 4
      train_known_indices: [0, 1, 2, 4, 5]
      surrogate_unknown_indices: [3, 6]

sampling:
  pair_protocol_source: arpl_lite_surrogate_osr_v1
  fold_count: 5
  frame_width_deg: 15
  development_angle_parity: odd
  base_seed: 20260830
  slot_order: randomized_seeded
  distinct_frames: true
  pairs_per_class:
    smoke: 10
    full: 500
  final_test_pairs_generated: false

normalization:
  method: global_scalar_zscore
  fit_population: unique_train_known_base_samples_only
  epsilon: 1.0e-8

model:
  input_shape: [2, 601]
  feature_dim: 128
  methods:
    - M0_CURRENT_CE_MEAN
    - M1_CURRENT_ARPL_MEAN
    - M2_MS_MEAN_ARPL
    - M3_MS_SET_GLOBAL_ARPL
    - M4_MS_SET_HIER_ARPL
    - M5_MV_RPFORMER_MISMATCH
    - M6_MV_RPFORMER_FULL
    - M7_MV_CEFORMER_FULL
  encoder:
    architecture: hrrp_ms_resnet_v1
    shared_between_views: true
    input_length: 601
    stem_channels: 32
    stem_kernel_size: 31
    stage_channels: [32, 64, 128]
    branch_kernel_sizes: [3, 7, 15]
    branch_convolution: standard_conv1d
    activation: GELU
    dropout: 0.1
    pooling: [global_average, global_max]
    projection_dim: 128
  set_transformer:
    sab_layers: 1
    embedding_dim: 128
    num_heads: 4
    ffn_hidden_dim: 256
    dropout: 0.1
    pre_layer_norm: true
    position_encoding: false
    pma_seed_count: 2
    output_sab_layers: 0
  rejector:
    hidden_dims: [64, 32]
    dropout: 0.1
    global_prediction_conditions_view_support: true
    symmetric_support_order: sorted_descending
    output: sigmoid_probability_unknown
  arpl:
    num_centers_per_class: 1
    reciprocal_init_std: 0.1
    initial_radius: 0.0
    temperature: 1.0
    weight_pl: 0.1
    margin: 1.0
    global_view_heads_independent: true
    lambda_view: 0.5

pseudo_unknown:
  train_known_only: true
  real_to_pseudo_ratio: 1.0
  mismatch:
    require_different_classes: true
    use_view1_from_anchor_view2_from_partner: true
  coherent_mixup:
    require_different_classes: true
    beta_alpha: 2.0
    beta_beta: 2.0
    lambda_min: 0.3
    lambda_max: 0.7
    same_lambda_for_both_views: true
  composition:
    M5_MV_RPFORMER_MISMATCH: {mismatch: 1.0, coherent_mixup: 0.0}
    M6_MV_RPFORMER_FULL: {mismatch: 0.5, coherent_mixup: 0.5}
    M7_MV_CEFORMER_FULL: {mismatch: 0.5, coherent_mixup: 0.5}

loss:
  lambda_reject: 1.0
  lambda_uniform: 0.1
  uniform_direction: KL_uniform_to_softmax

training:
  development_seeds: [20260830]
  confirmation_seeds: [20260830, 20260831, 20260832]
  development_methods:
    - M0_CURRENT_CE_MEAN
    - M1_CURRENT_ARPL_MEAN
    - M2_MS_MEAN_ARPL
    - M3_MS_SET_GLOBAL_ARPL
    - M4_MS_SET_HIER_ARPL
    - M5_MV_RPFORMER_MISMATCH
    - M6_MV_RPFORMER_FULL
    - M7_MV_CEFORMER_FULL
  confirmation_methods:
    - M0_CURRENT_CE_MEAN
    - M1_CURRENT_ARPL_MEAN
    - M2_MS_MEAN_ARPL
    - M3_MS_SET_GLOBAL_ARPL
    - M4_MS_SET_HIER_ARPL
    - M5_MV_RPFORMER_MISMATCH
    - M6_MV_RPFORMER_FULL
    - M7_MV_CEFORMER_FULL
  optimizer: AdamW
  learning_rate: 3.0e-4
  weight_decay: 1.0e-4
  batch_size: 64
  batch_size_semantics: 64_real_known_plus_64_generated_pseudo_when_active
  total_epochs: 100
  smoke_epochs: 31
  representation_only_epochs: 30
  scheduler: warmup_cosine
  warmup_epochs: 5
  formal_checkpoint_epoch: 100
  early_stopping: false
  calibration_checkpoint_selection: false
  dataloader_seed_offset: 1
  pseudo_seed_offset: 2
  deterministic_algorithms: true
  num_workers: 0

runtime:
  torch_intraop_threads: 4
  torch_interop_threads: 1
  recommended_parallel_jobs: 2

evaluation:
  base_unknown_score: negative_maximum_global_raw_logit
  learned_unknown_score: rejector_probability_unknown
  unknown_score_direction: larger_is_more_unknown
  threshold_source: known_calibration_only
  threshold_known_acceptance_rate: 0.95
  report_metrics:
    - known_accuracy
    - known_macro_f1
    - auroc
    - oscr
    - fpr95
    - unknown_rejection_rate
    - k_plus_1_macro_f1

confirmation_decision:
  unit_count: 12
  m6_vs_m4:
    minimum_mean_auroc_delta: 0.02
    minimum_positive_auroc_units: 8
    minimum_mean_oscr_delta: 0.0
    maximum_mean_known_accuracy_drop: 0.01
    maximum_mean_fpr95_increase: 0.02
  m6_vs_m7:
    minimum_mean_auroc_delta: 0.01
    minimum_positive_auroc_units: 7

outputs:
  namespace: artifacts/arpl/mv_rpformer_surrogate_v1
  fail_if_output_nonempty: true
  save_resolved_config: true
  save_pair_manifest_and_hash: true
  save_real_pseudo_pair_audit: true
  save_epoch_100_checkpoint: true
  save_attention_weights: true
  save_tokens_logits_scores: true
  save_reciprocal_points_and_radius_trajectories: true
  save_predictions: true
  save_training_logs: true
  save_environment_and_hashes: true
