schema_version: 1
stage: P0
result_scope: diagnostic_parameter_selection
selection_id: amdr_fold0_pilot_local_knn_lambda2_50_d_strategy_control_v1

base_experiment_config: configs/amdr/pilot_fold0_amplitude_pruned_fixed_d_local_knn_v1.yaml

evidence_scope:
  posthoc_after_fold0_test_seen: true
  confirmatory_claim_allowed: false
  controlled_change: l21_reweighting_only

selection:
  split: calibration
  test_features_materialized: false
  test_metrics_used: false
  primary_metric: calibration_accuracy
  secondary_metric: calibration_macro_f1
  knn_k: 3
  l21_reweighting:
    - fixed_initial
    - update_each_iteration
  lambda_manifold: [1.0]
  lambda_sparse: [50.0]
  tie_break_order:
    - higher_calibration_accuracy
    - higher_calibration_macro_f1
    - lower_lambda_manifold
    - lower_lambda_sparse
  boundary_rule: report_boundary_without_automatic_extension

test_gate:
  candidate: update_each_iteration
  reference: fixed_initial
  require_converged: true
  minimum_calibration_accuracy_gain: 0.005
  require_calibration_macro_f1_noninferior: true
  if_gate_fails: do_not_materialize_test
  if_gate_passes: materialize_test_once_with_frozen_dynamic_d_config

outputs:
  save_pair_manifest: true
  save_each_candidate_model: true
  save_each_candidate_training_log: true
  save_selection_summary: true
  diagnostic_only: true
