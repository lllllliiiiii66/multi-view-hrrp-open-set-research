bundle:
  dataset_id: hrrp_10class_theta83_hh_v1
  preprocessing_id: hrrp_padding_complex_gaussian_v1
  profiles_sha256: 2dd92282c125f0f677cf1f2dfce828781c8ba4385cf9ae552c4a2c56033c3f5b
  manifest_sha256: 748b9f30629c3b3cbe66c6a1dac30863fdab2d81a214e46d8bc3ef7c6022a08a
  bundle_sha256: 79176091b5b745e5df5957f1bb4ade7304c1403a4a32e64622e012db67d5a0c5
  elevation_deg: 83
  profile_field: TrcsHH
  profile_length: 601

protocol:
  frame_width_deg: 15
  frame_count: 24
  development_angle_parity: odd
  test_angle_parity: even
  fold_count: 5
  fold_index: 0
  known_class_count: 7
  unknown_class_count: 3
  test_unknown_used_for_selection: false

sampling:
  algorithm: uniform_ordered_cross_frame_balanced_base_usage
  base_seed: 20260830
  distinct_frames: true
  duplicate_unordered_pairs: false
  pairs_per_class:
    train: 100
    calibration: 100
    test: 100
  future_registered_scales:
    pilot_pairs_per_class: 500
    first_main_pairs_per_class: 2000

preprocessing:
  source_representation: power_decibel
  transform: power_db_to_per_profile_relative_power
  formula: 10 ** ((x_db - max(x_db)) / 10)
  output_max_per_profile: 1.0
  status: smoke_only_not_formal_preprocessing

model:
  implementation_scope: python_translation_smoke_v1
  view_count: 2
  lambda_manifold: 0.01
  lambda_sparse: 0.01
  max_iterations: 3
  tolerance: 3.0e-5
  numerical_epsilon: 1.0e-10
  solve_ridge: 1.0e-6
  initialization_seed: 20260830
  l21_reweighting: update_each_iteration
  graph_storage: exact_class_blocks
  formal_paper_reproduction: false

knn:
  k: 3
  distance: squared_euclidean
  unknown_score: mean_k_neighbor_squared_distance
  score_direction: larger_is_more_unknown
  known_acceptance_rate: 0.95
  threshold_source: current_fold_known_calibration_only

outputs:
  save_pair_manifest: true
  save_model: true
  save_projections: true
  save_predictions: true
  save_environment: true
  diagnostic_only: true
