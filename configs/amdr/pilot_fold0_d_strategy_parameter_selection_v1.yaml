schema_version: 1
stage: P0
result_scope: diagnostic_parameter_selection
selection_id: amdr_fold0_pilot_d_strategy_parameter_selection_v1

base_experiment_config: configs/amdr/pilot_fold0_amplitude_pruned_v1.yaml

selection:
  split: calibration
  test_features_materialized: false
  test_metrics_used: false
  primary_metric: calibration_accuracy
  secondary_metric: calibration_macro_f1
  knn_k: 3
  l21_reweighting:
    - fixed_initial
    - update_each_iteration
  lambda_manifold: [0.01, 0.1, 1.0, 10.0]
  lambda_sparse: [0.01, 0.1, 1.0, 10.0]
  tie_break_order:
    - higher_calibration_accuracy
    - higher_calibration_macro_f1
    - lower_lambda_manifold
    - lower_lambda_sparse
  boundary_rule: extend_once_before_test_if_selected_lambda_is_grid_boundary

outputs:
  save_pair_manifest: true
  save_each_candidate_model: true
  save_each_candidate_training_log: true
  save_selection_summary: true
  diagnostic_only: true
